<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Pratik Gurjar</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0f;
        color: #f2f2f5;
        font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace;
        text-align: center;
        padding: 24px;
      }
      .code { font-size: clamp(64px, 14vw, 120px); font-weight: 700; color: #8b87f7; letter-spacing: -0.02em; }
      .line { color: #9b9ba6; font-size: 15px; max-width: 46ch; line-height: 1.7; }
      .dim { color: #8a8a94; font-size: 13px; }
      svg { width: min(420px, 80vw); height: 60px; }
      a {
        color: #f2f2f5;
        border: 1px solid #34343f;
        border-radius: 10px;
        padding: 12px 22px;
        text-decoration: none;
        font-size: 14px;
        transition: border-color 0.2s, background 0.2s;
      }
      a:hover { border-color: #8b87f7; background: rgba(91, 84, 232, 0.14); }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <svg viewBox="0 0 420 60" aria-hidden="true">
      <path
        d="M0 30 H150 L165 30 172 12 180 48 188 22 194 36 200 30 H420"
        fill="none"
        stroke="#5b54e8"
        stroke-width="1.5"
        opacity="0.8"
      />
    </svg>
    <p class="line">Route not found. The switch has no rail for this path.</p>
    <p class="dim">If it helps: 402 is Payment Required. This is not that.</p>
    <a href="/">Back to the network</a>
  </body>
</html>
